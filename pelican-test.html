function frameBar(x,i){const c=i===18?'#71867b':i===19?'#b7b28c':'#9d855b';rect(x-17,0,34,H,c);rect(x-13,0,5,H,'#e4d0a2');rect(x+8,0,5,H,'#534a36');rect(x-5,0,3,H,'#e4d0a288');for(let y=20;y<900;y+=32){path(`M ${x-7} ${y} l 7 -11 7 11 -7 11 Z`,null,'#e1c388',1)} }

}

 const rx=800+ease((et-2)/3)*390;ctx.save();ctx.translate(rx,658);ctx.scale(.38,.38);ctx.translate(-748,-628);rider(7,127+Math.min(et,5),0);ctx.restore();rect(1300,490,164,153,'#9e8963');rect(1308,498,148,137,'#f7f1df');line(1320,644,1300,712,'#746b50',4);line(1440,644,1460,712,'#746b50',4);

}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function updateUI(){const i=time<7?-1:time>=127?20:Math.floor((time-7)/6);$('seek').value=time;$('time').textContent=fmt(time)+' / 02:17';$('play').textContent=playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',playing?'暫停':'播放');$('cover').classList.toggle('hidden',playing||time>0);if(i!==lastUI){$('count').textContent=i===-1?'序章':i===20?'尾聲':String(i+1).padStart(2,'0')+' / 20';$('scene').textContent=i===-1?'岩壁上的第一筆':i===20?'藝術一直在變':scenes[i][0];document.querySelectorAll('.chapter').forEach((b,n)=>{b.classList.toggle('active',n===i);b.setAttribute('aria-current',n===i?'true':'false')});lastUI=i}}
const melody=[0,4,7,9,7,4,2,-3,0,4,7,12,11,7,4,2];
function initAudio(){if(audioCtx){audioCtx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();master=audioCtx.createGain();master.gain.value=audioEnabled?Number($('volume').value):0;master.connect(audioCtx.destination);recordDest=audioCtx.createMediaStreamDestination();master.connect(recordDest)}
function tone(freq,dur,vol,type='sine',delay=0){if(!audioCtx||!playing)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=audioCtx.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+.02)}
function bell(){tone(1480,.7,.13);tone(2220,.5,.055,'sine',.04);tone(2960,.25,.024)}
function audioTick(){if(!audioCtx||!audioEnabled)return;let beat=Math.floor(time/.375);if(beat!==lastNote){lastNote=beat;const i=time<7?0:time>=127?19:Math.floor((time-7)/6);const typ=['triangle','sine','triangle','sine','sine','triangle','sine','sine','triangle','sine','triangle','sine','sine','triangle','sine','sine','triangle','triangle','square','sine'][i];tone(220*Math.pow(2,melody[beat%16]/12),.32,i===18?.045:.095,typ);if(beat%4===0){tone(110*Math.pow(2,[0,-3,-5,-7][Math.floor(beat/16)%4]/12),1.3,.09,'sine');tone(1700,.025,.016,'triangle')}if(beat%2===0)tone(900,.045,.012,'triangle')}
 const b=time<7?-1:time<127?Math.floor((time-7)/6):20,local=time<7?time:time<127?(time-7)%6:time-127;if(b!==lastBell&&((b<20&&local>2.1)||(b===20&&local>6.5))){lastBell=b;bell()}}
function setPlaying(v){if(recording&&!v){notify('匯出進行中，完成後即可操作。');return}if(v&&time>=DURATION)time=0;playing=v;if(v){initAudio();lastStamp=performance.now()}updateUI()}
function seek(v){if(recording)return;time=clamp(Number(v),0,DURATION);lastNote=-1;lastBell=-1;draw(time);updateUI()}
function tick(stamp){if(playing){time=Math.min(DURATION,time+(stamp-lastStamp)/1000);audioTick();if(time>=DURATION){playing=false;if(recording)stopRecording()}}lastStamp=stamp;draw(time);updateUI();requestAnimationFrame(tick)}
function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.display='none',4500)}
$('play').onclick=()=>setPlaying(!playing);$('cover').onclick=()=>setPlaying(true);$('restart').onclick=()=>{if(recording)return;seek(0);setPlaying(true)};$('seek').oninput=e=>seek(e.target.value);
function setSound(v){audioEnabled=v;initAudio();if(master)master.gain.setTargetAtTime(v?Number($('volume').value):0,audioCtx.currentTime,.03);$('sound').textContent='聲音：'+(v?'開':'關');$('sound').setAttribute('aria-label',v?'關閉聲音':'開啟聲音')}
$('sound').onclick=()=>setSound(!audioEnabled);$('volume').oninput=()=>{if(!audioEnabled)setSound(true);else if(master)master.gain.setTargetAtTime(Number($('volume').value),audioCtx.currentTime,.03)};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('stage').requestFullscreen().catch(()=>notify('此瀏覽器暫時無法使用全螢幕。'))};
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}else if(e.code==='ArrowRight'){e.preventDefault();seek(time+5)}else if(e.code==='ArrowLeft'){e.preventDefault();seek(time-5)}else if(e.code==='KeyF')$('full').click()});
scenes.forEach((s,i)=>{let b=document.createElement('button');b.className='chapter';b.innerHTML='<b>'+String(i+1).padStart(2,'0')+' · '+fmt(7+i*6)+'</b><span>'+s[0]+'</span>';b.onclick=()=>seek(7+i*6+1.5);$('chapters').appendChild(b)});
let recordedChunks=[];
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();recording=false;$('export').textContent='匯出影片 ↓';$('export').classList.remove('recording');$('seek').disabled=false;document.querySelectorAll('.chapter').forEach(b=>b.disabled=false)}
$('export').onclick=async()=>{if(recording){notify('正在匯出，請保持此分頁開啟至播放結束。');return}if(!window.MediaRecorder||!canvas.captureStream){notify('此瀏覽器不支援匯出，請使用 Chrome 或 Edge。');return}try{playing=false;seek(0);setSound(true);await audioCtx.resume();const stream=canvas.captureStream(30);recordDest.stream.getAudioTracks().forEach(track=>stream.addTrack(track));const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw Error('沒有可用的 WebM 編碼器');recordedChunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8500000});recorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='鵜鶘測試.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);stream.getVideoTracks().forEach(t=>t.stop());notify('影片已匯出，下載檔案包含畫面與配樂。')};recorder.onerror=()=>{stopRecording();notify('匯出中斷，請重新嘗試。')};recorder.start(1000);recording=true;$('export').textContent='● 匯出中';$('export').classList.add('recording');$('seek').disabled=true;document.querySelectorAll('.chapter').forEach(b=>b.disabled=true);setPlaying(true);notify('開始匯出 2:17 影片；請保持此分頁在前景，播放完成後會自動下載。')}catch(e){stopRecording();notify('無法開始匯出：'+e.message)}};
